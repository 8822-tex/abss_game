<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ABSS Map</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="loading">Loading ABSS Map...</div>

  <div id="hud">
    <b>ABSS MAP</b>
    <span id="location">Main Campus</span>
  </div>

  <div id="lookHint">Drag right side to look around</div>

  <div id="crosshair">+</div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="jump">JUMP</button>
  <button id="run">RUN</button>

  <script type="module" src="game.js"></script>

</body>
</html>
